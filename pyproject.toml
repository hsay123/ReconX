[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reconx"
version = "0.2.0"
description = "Passive website reconnaissance CLI: DNS, WHOIS, HTTP, TLS and subdomain intelligence in one command."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yash", email = "yashlandge150@gmail.com" }]
keywords = ["recon", "reconnaissance", "dns", "whois", "tls", "osint", "security", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "dnspython>=2.6",
    "requests>=2.31",
    "python-whois>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.6",
]
rich = ["rich>=13.0"]

[project.urls]
Homepage = "https://github.com/hsay123/ReconX"
Repository = "https://github.com/hsay123/ReconX"
Issues = "https://github.com/hsay123/ReconX/issues"
Changelog = "https://github.com/hsay123/ReconX/blob/main/CHANGELOG.md"

[project.scripts]
reconx = "reconx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["reconx"]

[tool.hatch.build.targets.sdist]
include = ["reconx", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["reconx"]
branch = true
omit = ["reconx/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
# __main__ is only executed by `python -m reconx`; the console script path is
# covered by the subprocess test instead.
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RET",  # return simplification
    "ARG",  # unused arguments
    "PTH",  # pathlib
    "RUF",  # ruff-specific
    "S",    # bandit
    "BLE",  # blind except
    "ANN",  # annotations
    "D",    # pydocstyle
    "T20",  # no stray print() in library code
]
ignore = [
    "D203",     # incompatible with D211
    "D213",     # incompatible with D212
    "S101",     # assert is fine in tests and internal invariants
    "BLE001",   # broad except is deliberate: one module must never kill the run
    "ANN401",   # recon data is heterogeneous by nature; Any is the honest type
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D", "S101", "ARG", "PTH"]
# The CLI's entire job is writing to stdout/stderr.
"reconx/cli.py" = ["T201", "T203"]
"reconx/__main__.py" = ["T201"]
# Legacy interactive shim: printing to stdout is its whole purpose.
"ReconX.py" = ["D", "ANN", "E402", "F401", "S603", "S607", "T20"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]
